[project]
name = "tikrview"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.1.7",
    "chronos-forecasting>=2.0",
    "feedparser>=6.0.12",
    "kronos-model-arch>=0.1.0",
    "pandas-ta-classic>=0.6.52",
    "pandas[pyarrow]>=3.0.5",
    "plotly>=6.9.0",
    "pyside6>=6.11.1",
    "pywebview>=6.2.1",
    "qt-material>=2.17",
    "timesfm[torch]>=2.0.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "yfinance>=1.5.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true